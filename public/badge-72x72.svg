<!-- Notification badge: Njimbong logo mark — white on transparent for Android/iOS badge masking -->
<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="Njimbong notification">
  <!--
    Matches the Njimbong logo:
      • 3-arc recycling ring (each arc 100°, 20° gap at each arrowhead, CW)
      • Slimmer N with downward arrow on left, upward arrow on right
    All white on transparent so the OS can apply its own badge colour.

    Arc maths (center 36,36 radius 28):
      Arc from 240° → 340° (CW, 100°):
        Start  240°: (22.00, 11.75)
        End    340°: (62.31, 26.42)
      CW tangent at 340°: (0.342, 0.940)
      Arrowhead wings (back 7px, spread ±3.5px perp):
        (56.6, 21.0) and (63.2, 18.6)
    The same arc+arrowhead is rotated 120° and 240° to form the other two.
  -->

  <!-- ── Recycling ring ─────────────────────────────────────── -->
  <g transform="rotate(0, 36, 36)">
    <path d="M 22 11.75 A 28 28 0 0 1 62.31 26.42"
          stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <polygon points="62.31,26.42 56.6,21.0 63.2,18.6" fill="white"/>
  </g>
  <g transform="rotate(120, 36, 36)">
    <path d="M 22 11.75 A 28 28 0 0 1 62.31 26.42"
          stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <polygon points="62.31,26.42 56.6,21.0 63.2,18.6" fill="white"/>
  </g>
  <g transform="rotate(240, 36, 36)">
    <path d="M 22 11.75 A 28 28 0 0 1 62.31 26.42"
          stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <polygon points="62.31,26.42 56.6,21.0 63.2,18.6" fill="white"/>
  </g>

  <!-- ── N mark (slimmer — 4 px bars, centred, fits inside the ring) ── -->
  <!-- Left vertical bar -->
  <rect x="24" y="20" width="4" height="22" rx="1" fill="white"/>
  <!-- ↓ arrow at base of left bar -->
  <polygon points="20,42 32,42 26,53" fill="white"/>

  <!-- Right vertical bar -->
  <rect x="44" y="26" width="4" height="22" rx="1" fill="white"/>
  <!-- ↑ arrow at top of right bar -->
  <polygon points="40,26 52,26 46,15" fill="white"/>

  <!-- Diagonal stroke: top of left bar → bottom of right bar -->
  <polygon points="24,20 28,20 48,48 44,48" fill="white"/>
</svg>

