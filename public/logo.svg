<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Njimbong">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>
  <!-- N stem left -->
  <rect x="44" y="52" width="18" height="96" rx="4" fill="white"/>
  <!-- N diagonal -->
  <polygon points="44,52 62,52 122,136 104,136" fill="white"/>
  <!-- N stem right -->
  <rect x="104" y="52" width="18" height="96" rx="4" fill="white"/>
  <!-- j dot -->
  <circle cx="134" cy="60" r="9" fill="white"/>
  <!-- j stem -->
  <rect x="125" y="76" width="18" height="72" rx="4" fill="white"/>
  <!-- j curl — covers bottom-right to make the hook -->
  <path d="M143 144 Q143 160 128 160 Q118 160 113 153 L124 145 Q126 151 130 151 Q135 151 135 144 Z" fill="white"/>
  <!-- clip the j stem bottom cleanly -->
  <rect x="125" y="140" width="18" height="8" fill="url(#bg)"/>
</svg>
